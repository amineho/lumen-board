name: build

on:
  schedule:
    - cron: "17 8 * * *"   # kol nhar 08:17 UTC (09:17 f lmaghrib)
  workflow_dispatch:
    inputs:
      discover:
        description: "Discovery dyal keywords jdad"
        type: boolean
        default: true
      keywords:
        description: 'Ghir had keywords: "all" wla "term|us;term|fr" (khawi = check kamel)'
        type: string
        default: ""
  push:
    branches: [main]
    paths: [config.json]  # mli tbdel config mn dashboard, check kaybda wa7do

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ranks
        env:
          EVENT: ${{ github.event_name }}
          DISCOVER: ${{ github.event.inputs.discover }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
        run: |
          set -- --run
          if [ "$EVENT" = "push" ] || [ "$DISCOVER" = "false" ]; then set -- "$@" --no-discover; fi
          if [ -n "$KEYWORDS" ]; then set -- "$@" --keywords "$KEYWORDS"; fi
          python tracker.py "$@"

      - name: Sjjel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aso.db docs/data
          git diff --cached --quiet && exit 0
          git commit -m "update"
          git pull --rebase
          git push
