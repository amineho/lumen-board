name: build

on:
  schedule:
    - cron: "17 8 * * *"   # kol nhar 08:17 UTC (09:17 f lmaghrib)
  workflow_dispatch:
    inputs:
      discover:
        description: "Discovery dyal keywords jdad"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [config.json]  # mli tbdel config mn dashboard, check kaybda wa7do

permissions:
  contents: write

concurrency:
  group: aso-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ranks
        run: python tracker.py --run ${{ (github.event_name == 'push' || github.event.inputs.discover == 'false') && '--no-discover' || '' }}

      - name: Sjjel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aso.db docs/data
          git diff --cached --quiet && exit 0
          git commit -m "update"
          git pull --rebase
          git push
