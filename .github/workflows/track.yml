name: build

on:
  schedule:
    # kol 2 sa3at (sa3at fardiya UTC: 01:03, 03:03 ... 23:03). Tool kaykhtar wa7do: check kamel mra f nhar
    # (daily_hour_utc = 3 ➜ 04:03 f lmaghrib), o f lb9i discovery kaykmmel mn fin w9ef (time_budget_minutes).
    # Hakka run ~25 d9i9a kol 2 sa3at: isti3mal m3a9el dyal GitHub Actions.
    - cron: "3 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Discovery dyal keywords jdad"
        type: boolean
        default: true
      keywords:
        description: 'Ghir had keywords: "all" wla "term|us;term|fr" (khawi = check kamel)'
        type: string
        default: ""
  push:
    branches: [main]
    paths: [config.json]  # mli tbdel config mn dashboard, check kaybda wa7do

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data (aso.db + docs/data) katkoun f branch "data", machi f main, bach historique ma ykberch
      - name: Jib data
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- aso.db docs/data
          else
            echo "Mazal ma kayn ta data (awel run)"
          fi

      - name: Check ranks
        env:
          EVENT: ${{ github.event_name }}
          DISCOVER: ${{ github.event.inputs.discover }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
          ASO_CHECKPOINT: .github/save-data.sh  # sauvegarde kol 10 d9aye9
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -- --run
          if [ -n "$KEYWORDS" ]; then set -- "$@" --keywords "$KEYWORDS"
          elif [ "$EVENT" = "push" ] || [ "$DISCOVER" = "false" ]; then set -- "$@" --no-discover
          elif [ "$EVENT" = "schedule" ]; then set -- "$@" --auto
          fi
          python tracker.py "$@"

      - name: Sjjel data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/save-data.sh
