<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ASO Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #667085; --line: #e4e7ec; --grid: #eef0f3;
  --accent: #2f6fed; --accent-soft: #e8f0fe; --good: #138a4b; --good-soft: #e6f6ed;
  --bad: #c4321c; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff4d6;
  --shadow: 0 20px 60px rgba(16, 24, 40, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --muted: #98a2b3; --line: #2a2f3a; --grid: #222733;
    --accent: #6b9cff; --accent-soft: #1c2a47; --good: #4ade80; --good-soft: #143322;
    --bad: #ff7b6b; --bad-soft: #3a1d1a; --warn: #f5c451; --warn-soft: #3a2f12;
    --shadow: 0 20px 60px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --muted: #98a2b3; --line: #2a2f3a; --grid: #222733;
  --accent: #6b9cff; --accent-soft: #1c2a47; --good: #4ade80; --good-soft: #143322;
  --bad: #ff7b6b; --bad-soft: #3a1d1a; --warn: #f5c451; --warn-soft: #3a2f12;
  --shadow: 0 20px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
:lang(ar) body, :lang(ar) button, :lang(ar) input, :lang(ar) textarea, :lang(ar) select { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
header img { width: 64px; height: 64px; border-radius: 14px; border: 1px solid var(--line); }
header h1 { margin: 0; font-size: 20px; }
header .sub { color: var(--muted); }
header .actions { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
button.small { padding: 3px 9px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; background: var(--card); color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border-radius: 8px; color: var(--muted); }
.icon-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.icon-btn.danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.spin svg, .with-icon.spin svg { animation: spin 1s linear infinite; }
.with-icon { display: inline-flex; align-items: center; gap: 8px; }
.with-icon svg { width: 16px; height: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg, .with-icon.spin svg { animation: none; } }
.row-actions { display: inline-flex; gap: 6px; }
nav { display: flex; gap: 4px; margin: 20px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 14px; color: var(--muted); white-space: nowrap; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 15px; }
.card-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; user-select: none; }
th[data-sort] { cursor: pointer; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
tr.busy td { background: var(--accent-soft); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
.badge.auto { background: var(--good-soft); color: var(--good); }
.rank { font-weight: 650; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); } .muted { color: var(--muted); }
.yes { color: var(--good); } .no { color: var(--muted); }
textarea, input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 160px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { margin: 0; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--text); cursor: pointer; }
.chips input { width: auto; }
.progress { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin: 8px 0; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.log { font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); max-height: 160px; overflow: auto; white-space: pre-wrap; direction: ltr; text-align: left; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.note.ok { background: var(--good-soft); color: var(--good); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.hidden { display: none !important; }
svg.spark { vertical-align: middle; }
.desc { white-space: pre-wrap; color: var(--muted); max-height: 220px; overflow: auto; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; }
.kv > div { min-width: 0; overflow-wrap: anywhere; }
.kv div:nth-child(odd) { color: var(--muted); }
.serp td:first-child { width: 30px; }
.serp tr.me td { background: var(--good-soft); font-weight: 600; }
ol.steps { margin: 4px 0 0; padding-inline-start: 20px; }
code { font: 12px ui-monospace, Menlo, Consolas, monospace; direction: ltr; unicode-bidi: embed; }

/* chart modal */
/* login (GitHub mode): dashboard msdoud 7ta yt2kked token */
.gh:not(.authed) .wrap { display: none; }
.gate { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gate-box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.gate-box h1 { margin: 0 0 6px; font-size: 20px; }
.gate-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.gate-lock { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.gate-lock svg { width: 20px; height: 20px; }
.gate details { margin-top: 14px; color: var(--muted); font-size: 13px; }
.gate summary { cursor: pointer; color: var(--text); }
.overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 18px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 16px; text-wrap: balance; }
.mstats { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 12px; }
.mstats div { display: grid; }
.mstats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.mstats > div > span { color: var(--muted); font-size: 12px; }
.chartbox { position: relative; direction: ltr; }
.chartbox svg { display: block; width: 100%; height: auto; }
.chartbox text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--card); padding: 6px 9px; border-radius: 8px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -10px; }
.tip b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script>if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.documentElement.classList.add("gh");</script>
<div class="gate hidden" id="gate">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <div class="gate-top">
      <div class="gate-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" class="langEn" lang="en">EN</button>
        <button type="button" class="langAr" lang="ar">العربية</button>
      </div>
    </div>
    <h1 data-i18n="gateTitle"></h1>
    <div class="muted" data-i18n="gateIntro"></div>
    <label for="gateToken" data-i18n="token"></label>
    <input id="gateToken" type="password" dir="ltr" placeholder="github_pat_…" autocomplete="off" required>
    <label for="gateRepo" data-i18n="repo"></label>
    <input id="gateRepo" dir="ltr" placeholder="owner/repo">
    <div class="note bad hidden" id="gateErr" style="margin:12px 0 0"></div>
    <div style="margin-top:14px"><button class="primary" id="gateBtn" type="submit" style="width:100%" data-i18n="gateBtn"></button></div>
    <details>
      <summary data-i18n="howToken"></summary>
      <ol class="steps" id="gateSteps"></ol>
    </details>
  </form>
</div>
<div class="wrap">
  <header>
    <img id="icon" alt="" hidden>
    <div>
      <h1 id="appname" data-i18n="title">ASO Tracker</h1>
      <div class="sub" id="appsub">…</div>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="Language">
        <button class="langEn" lang="en">EN</button>
        <button class="langAr" lang="ar">العربية</button>
      </div>
      <button id="runFull" class="primary" data-i18n="runFull"></button>
      <button id="logout" class="hidden" data-i18n="logout"></button>
    </div>
  </header>

  <div class="note hidden" id="flash" style="margin-top:16px"></div>

  <div class="card hidden" id="statusCard" style="margin-top:16px">
    <div><b id="stStep"></b> <span class="muted" id="stCount"></span></div>
    <div class="progress"><div id="stBar"></div></div>
    <div class="log" id="stLog"></div>
  </div>

  <nav id="tabs">
    <button data-tab="overview" class="on" data-i18n="tabOverview"></button>
    <button data-tab="keywords" data-i18n="tabKeywords"></button>
    <button data-tab="discovery" data-i18n="tabDiscovery"></button>
    <button data-tab="analysis" data-i18n="tabAnalysis"></button>
    <button data-tab="charts" data-i18n="tabCharts"></button>
    <button data-tab="settings" data-i18n="tabSettings"></button>
  </nav>

  <!-- OVERVIEW -->
  <section id="tab-overview">
    <div class="grid" id="stats"></div>
    <div class="card">
      <h2 data-i18n="appInfo"></h2>
      <div class="row" style="margin-bottom:10px"><div style="max-width:200px"><select id="infoCountry" aria-label="Country"></select></div></div>
      <div class="kv" id="infoKv"></div>
    </div>
    <div class="card">
      <h2 data-i18n="ratingsByCountry"></h2>
      <div class="tablewrap"><table id="ratingsTable"></table></div>
    </div>
    <div class="card">
      <h2 data-i18n="description"></h2>
      <div class="desc" id="desc" dir="auto"></div>
    </div>
  </section>

  <!-- KEYWORDS -->
  <section id="tab-keywords" class="hidden">
    <div class="card">
      <h2 data-i18n="addKeywords"></h2>
      <label for="newTerms" data-i18n="kwInputLabel"></label>
      <textarea id="newTerms" dir="auto" placeholder="basketball game&#10;slam dunk&#10;streetball"></textarea>
      <label data-i18n="inCountries"></label>
      <div class="chips" id="addCountries"></div>
      <div style="margin-top:12px"><button class="primary" id="addBtn" data-i18n="add"></button> <span class="muted" id="addMsg"></span></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="tabKeywords"></h2>
        <button id="refreshAll" class="with-icon"></button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <div><label for="kwCountry" data-i18n="country"></label><select id="kwCountry"></select></div>
        <div><label for="kwSource" data-i18n="source"></label><select id="kwSource">
          <option value="" data-i18n="all"></option><option value="manual" data-i18n="srcManual"></option><option value="auto" data-i18n="srcAuto"></option></select></div>
        <div><label for="kwRanked" data-i18n="rankF"></label><select id="kwRanked">
          <option value="" data-i18n="all"></option><option value="1" data-i18n="onlyRanked"></option><option value="0" data-i18n="onlyNot"></option></select></div>
        <div><label for="kwSearch" data-i18n="search"></label><input id="kwSearch" dir="auto" data-i18n-ph="searchPh"></div>
      </div>
      <div class="tablewrap"><table id="kwTable"></table></div>
    </div>
    <div class="card hidden" id="serpCard">
      <h2 id="serpTitle"></h2>
      <div class="tablewrap"><table class="serp" id="serpTable"></table></div>
    </div>
  </section>

  <!-- DISCOVERY -->
  <section id="tab-discovery" class="hidden">
    <div class="card">
      <h2 data-i18n="discoveryHowTitle"></h2>
      <div class="muted" data-i18n="discoveryHow"></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div><label for="cdCountry" data-i18n="country"></label><select id="cdCountry"></select></div>
        <div><label for="cdRanked" data-i18n="result"></label><select id="cdRanked">
          <option value="" data-i18n="all"></option><option value="1" data-i18n="rankedOk"></option><option value="0" data-i18n="notRanking"></option></select></div>
      </div>
      <div class="tablewrap"><table id="cdTable"></table></div>
    </div>
  </section>

  <!-- ANALYSIS -->
  <section id="tab-analysis" class="hidden">
    <div class="card">
      <h2 data-i18n="anTitle"></h2>
      <div class="muted" style="margin-bottom:10px" data-i18n="anHelp"></div>
      <div class="row" style="margin-bottom:10px"><div style="max-width:200px"><select id="anCountry" aria-label="Country"></select></div></div>
      <div class="tablewrap"><table id="anTable"></table></div>
    </div>
  </section>

  <!-- CHARTS -->
  <section id="tab-charts" class="hidden">
    <div class="card">
      <h2 data-i18n="chTitle"></h2>
      <div class="tablewrap"><table id="chTable"></table></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="hidden">
    <div class="card">
      <h2 data-i18n="tabSettings"></h2>
      <div class="row">
        <div><label for="cfgApp" data-i18n="appId"></label><input id="cfgApp" dir="ltr"></div>
        <div id="cfgHourWrap"><label for="cfgHour" data-i18n="hour"></label><input id="cfgHour" type="number" min="0" max="23"></div>
        <div><label for="cfgCand" data-i18n="cand"></label><input id="cfgCand" type="number" min="0" max="200"></div>
      </div>
      <label for="cfgCountries" data-i18n="countriesL"></label>
      <input id="cfgCountries" dir="ltr">
      <label for="cfgKw" data-i18n="myKw"></label>
      <textarea id="cfgKw" dir="auto" placeholder="basketball,dunk,hoops,streetball,…"></textarea>
      <div style="margin-top:12px"><button class="primary" id="saveCfg" data-i18n="save"></button> <span class="muted" id="cfgMsg"></span></div>
    </div>
    <div class="card hidden" id="ghCard">
      <h2>GitHub</h2>
      <div class="muted" data-i18n="ghIntro"></div>
      <div class="row">
        <div><label for="ghRepo" data-i18n="repo"></label><input id="ghRepo" dir="ltr" placeholder="owner/repo"></div>
        <div><label for="ghToken" data-i18n="token"></label><input id="ghToken" dir="ltr" type="password" placeholder="github_pat_…" autocomplete="off"></div>
      </div>
      <div style="margin-top:12px"><button class="primary" id="ghSave" data-i18n="saveToken"></button> <span class="muted" id="ghMsg"></span></div>
      <label data-i18n="howToken"></label>
      <ol class="muted steps" id="ghSteps"></ol>
      <div class="muted" style="margin-top:10px" id="ghSchedule"></div>
    </div>
    <div class="card">
      <h2 data-i18n="searchMode"></h2>
      <div id="apiMode" class="muted"></div>
    </div>
  </section>
</div>

<div class="overlay hidden" id="chartModal" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 id="chartTitle"></h2>
      <button class="icon-btn" id="chartClose" data-i18n-title="close"></button>
    </div>
    <div class="mstats" id="chartStats"></div>
    <div class="chartbox" id="chartBox"></div>
    <div class="muted" id="chartNote" style="margin-top:8px"></div>
    <div style="margin-top:12px"><button class="small" id="chartTableBtn"></button></div>
    <div class="tablewrap hidden" id="chartTableWrap" style="margin-top:8px"><table id="chartTable"></table></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- i18n
const I18N = {
  en: {
    title: "ASO Tracker",
    lastCheck: "Last full check: {d}", lastRefresh: "last refresh: {d}", noCheck: "No check yet",

    keyword: "Keyword", rankToday: "Rank today", change: "Change", best: "Best", last30: "Last 30 days", actions: "Actions",
    badgeYou: "you", badgeAuto: "auto", notChecked: "not yet", newRank: "new", dropped: "dropped out",
    gateTitle: "Sign in", gateIntro: "This dashboard is private. Sign in with a GitHub token that has write access to the repository.",
    gateBtn: "Sign in", gateChecking: "Checking…", gateBad: "GitHub rejected this token. Check it and try again.",
    gateNoRepo: "The repository {repo} was not found with this token. Check the repository name and that the token includes it.",
    gateNoAccess: "This token has no write access to {repo}.", logout: "Sign out",

  token: () => store.get("aso_token"),

let S = null, KW = [], CD = [], tab = "overview";
let staticCache = {};

async function ghApi(path, opts = {}) {
  if (!GH.token()) throw new Error(t("needToken"));
  const r = await fetch(`https://api.github.com/repos/${GH.repo()}${path}`, {...opts, headers: {
    Authorization: `Bearer ${GH.token()}`, Accept: "application/vnd.github+json", "Content-Type": "application/json", ...(opts.headers || {})}});
  if (!r.ok) {
    const m = (await r.json().catch(() => ({}))).message || "";
    throw new Error(r.status === 401 || r.status === 403 ? t("ghRejected", {s: r.status, m: esc(m)}) : `GitHub ${r.status}: ${esc(m)}`);
  }
  if (r.status === 204) return {};
  return (opts.headers || {}).Accept === "application/vnd.github.raw+json" ? r.text() : r.json();
}
function staticGet(name) {
  // GitHub mode: data kat t9ra ghir b GitHub API b token dyal li dar login
  return staticCache[name] ??= ghApi(`/contents/docs/data/${name}?ref=main`, {headers: {Accept: "application/vnd.github.raw+json"}})
    .then(JSON.parse).catch(e => { if (/404/.test(e.message)) return null; throw e; });
}
// token khasso l7a9 ykteb f repo (ya3ni mol repo wla collaborator)
async function verifyLogin(token, repo) {
  const r = await fetch(`https://api.github.com/repos/${repo}`, {headers: {Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json"}});
  if (r.status === 401) return t("gateBad");
  if (r.status === 404 || r.status === 403) return t("gateNoRepo", {repo: esc(repo)});
  if (!r.ok) return `GitHub ${r.status}`;
  const d = await r.json();
  return d.permissions?.push ? "" : t("gateNoAccess", {repo: esc(repo)});
}
function showGate(err) {
  document.documentElement.classList.remove("authed");
  $("#gate").classList.remove("hidden");
  $("#gateRepo").value = GH.repo();
  $("#gateErr").innerHTML = err || "";
  $("#gateErr").classList.toggle("hidden", !err);
  $("#gateToken").focus();
}
async function editConfig(change) {
  const f = await ghApi("/contents/config.json");
  const cfg = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\n/g, "")), c => c.charCodeAt(0))));
  const message = change(cfg);
  let bin = "";
  new TextEncoder().encode(JSON.stringify(cfg, null, 2) + "\n").forEach(b => bin += String.fromCharCode(b));
  await ghApi("/contents/config.json", {method: "PUT", body: JSON.stringify({message, content: btoa(bin), sha: f.sha})});
}
// nefs l logique dyal config_add_keywords / config_remove_keyword f tracker.py
function configAdd(cfg, terms, countries) {
  const every = cfg.countries.every(c => countries.includes(c));
  const entries = every ? terms : terms.flatMap(t => countries.map(c => `${t}|${c}`));
  cfg.manual_keywords = [...new Set([...(cfg.manual_keywords || []), ...entries])];
  const added = new Set(terms.flatMap(t => countries.map(c => `${t}|${c}`)));
  cfg.removed_keywords = (cfg.removed_keywords || []).filter(r => !added.has(r));
}
function configRemove(cfg, term, country) {
  cfg.manual_keywords = (cfg.manual_keywords || []).filter(m => m !== `${term}|${country}`);
  cfg.removed_keywords = [...new Set([...(cfg.removed_keywords || []), `${term}|${country}`])];
}

async function ghWaitRun({dispatch, event}) {
  const since = Date.now() - 15000;
  if (dispatch) await ghApi("/actions/workflows/track.yml/dispatches", {method: "POST", body: JSON.stringify({ref: "main", inputs: dispatch})});
  let id = null;
  for (let i = 0; i < 240; i++) {
    await sleep(i < 4 ? 4000 : 8000);
    let run;
    if (!id) {
      const r = await ghApi(`/actions/workflows/track.yml/runs?event=${event}&per_page=5`);
      run = r.workflow_runs.find(x => Date.parse(x.created_at) >= since);
      if (!run) continue;
      id = run.id;
    } else run = await ghApi(`/actions/runs/${id}`);
    if (run.status === "completed") {
      if (run.conclusion === "success") return run;
      throw new Error(t(run.conclusion === "cancelled" ? "runCancelled" : "runFailedShort", {link: ghLink(run.html_url, "seeError")}));
    }
  }
  throw new Error(t("runFailedShort", {link: ghLink()}));
}

async function api(p, body) {
  if (LOCAL) return fetch(p, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {}).then(r => r.json());
  const u = new URL(p, location.origin);
  if (!body) {
    if (u.pathname === "/api/state") return staticGet("state.json");
    if (u.pathname === "/api/keywords") return (await staticGet("keywords.json")) || [];
    if (u.pathname === "/api/candidates") return (await staticGet("candidates.json")) || [];
    if (u.pathname === "/api/serp") return ((await staticGet("serp.json")) || {})[u.searchParams.get("id")] || {apps: []};
    if (u.pathname === "/api/analysis") return ((await staticGet("analysis.json")) || {})[u.searchParams.get("country")] || {words: [], sample: 0};
  }
  if (u.pathname === "/api/keywords") {
    const terms = body.terms.split(/[,\n]/).map(s => s.trim().toLowerCase()).filter(Boolean);
    await editConfig(cfg => { configAdd(cfg, terms, body.countries); return "update"; });
    return {added: terms.length * body.countries.length, github: true};
  }
  if (u.pathname === "/api/keywords/delete") {
    const gone = KW.filter(k => body.ids.includes(k.id));
    await editConfig(cfg => { gone.forEach(k => configRemove(cfg, k.term, k.country)); return "update"; });
    return {ok: true, github: true};
  }
  if (u.pathname === "/api/config") {
    await editConfig(cfg => {
      cfg.app_id = body.app_id; cfg.candidates_per_run = +body.candidates_per_run; cfg.my_keywords = body.my_keywords;
      cfg.countries = body.countries.split(",").map(c => c.trim().toLowerCase()).filter(Boolean);
      return "update";
    });
    return {ok: true, github: true};
  }
}

// ---------------------------------------------------------------- render
function flash(msg, kind) {
  const f = $("#flash");
  f.innerHTML = msg; f.classList.remove("hidden", "ok", "bad");
  if (kind) f.classList.add(kind);
}
function spark(hist) {
  const pts = hist.slice(-30);
  if (pts.length < 2) return "";
  const W = 90, H = 24, max = Math.max(...pts.map(p => p.rank || p.depth || 11), 11);
  const xy = pts.map((p, i) => [i * W / (pts.length - 1), p.rank ? 2 + (p.rank - 1) / (max - 1) * (H - 4) : H - 1]);
  const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg class="spark" width="${W}" height="${H}" style="direction:ltr" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}
function delta(k) {
  if (!k.rank && !k.prev) return "";
  if (k.rank && !k.prev) return `<span class="up">${t("newRank")}</span>`;
  if (!k.rank && k.prev) return `<span class="down">${t("dropped")}</span>`;
  const d = k.prev - k.rank;
  return d > 0 ? `<span class="up">▲ ${d}</span>` : d < 0 ? `<span class="down">▼ ${-d}</span>` : `<span class="muted">=</span>`;
}
function rankCell(k) {
  if (!k.checked) return `<span class="muted">${t("notChecked")}</span>`;
  return k.rank ? `<span class="rank">#${k.rank}</span>` : `<span class="muted" dir="ltr">&gt; ${k.depth || "?"}</span>`;
}

}

let CH = null;
function rankChartSvg(h, W) {
  const H = W < 500 ? 240 : 280, m = {l: 52, r: 18, t: 14, b: 30}, lane = 26;
  const plotB = H - m.b - lane, laneY = H - m.b - lane / 2 + 2;
  const ranked = h.filter(p => p.rank);
  const yMax = niceMax(Math.max(10, ...ranked.map(p => p.rank)));
  const y = r => m.t + (r - 1) / (yMax - 1) * (plotB - m.t);
  const times = h.map(p => Date.parse(p.date + "T12:00:00"));
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const x = tm => t1 === t0 ? (m.l + W - m.r) / 2 : m.l + (tm - t0) / (t1 - t0) * (W - m.l - m.r);
  const step = yMax / 5;
  const ticks = [1, ...Array.from({length: 5}, (_, i) => Math.round((i + 1) * step))];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartKw"))}">`;
  ticks.forEach(v => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">#${v}</text>`; });
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${laneY}" y2="${laneY}" stroke="var(--grid)" stroke-dasharray="3 4"/>`;
  s += `<text x="${m.l - 8}" y="${laneY + 4}" text-anchor="end">${esc(t("notRankedLane"))}</text>`;
  // x labels: mn lekher l lwel, b masafa kafya bach ma ytrakboch (akher nhar dima kayban)
  const n = h.length, gap = 76;
  let lastX = Infinity;
  for (let i = n - 1; i >= 0; i--) {
    const px = x(times[i]);
    if (lastX - px < gap) continue;
    const anchor = i === n - 1 && n > 1 ? "end" : i === 0 && n > 1 ? "start" : "middle";
    s += `<text x="${px}" y="${H - 8}" text-anchor="${anchor}">${esc(fmtDate(h[i].date, {day: "numeric", month: "short"}))}</text>`;
    lastX = px;
  }
  // line: kat t9te3 f iyam bla rank
  let d = "", open = false;
  h.forEach((p, i) => {
    if (p.rank) { d += `${open ? "L" : "M"}${x(times[i]).toFixed(1)} ${y(p.rank).toFixed(1)} `; open = true; } else open = false;
  });
  if (d) s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  h.forEach((p, i) => {
    const last = i === n - 1;
    s += p.rank
      ? `<circle cx="${x(times[i])}" cy="${y(p.rank)}" r="${last ? 5.5 : 4}" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`
      : `<circle cx="${x(times[i])}" cy="${laneY}" r="4" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>`;
  });
  if (n && h[n - 1].rank) s += `<text x="${x(times[n - 1]) + (n > 1 ? -10 : 10)}" y="${y(h[n - 1].rank) - 10}" text-anchor="${n > 1 ? "end" : "start"}" style="fill:var(--text);font-weight:600">#${h[n - 1].rank}</text>`;
  s += `<line id="chCross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect id="chHit" x="${m.l - 10}" y="0" width="${W - m.l - m.r + 20}" height="${H - m.b}" fill="transparent"/>`;
  s += `</svg><div class="tip hidden" id="chTip"></div>`;
  CH = {W, H, xs: times.map(x), ys: h.map(p => p.rank ? y(p.rank) : laneY)};
  return s;
}
function bindChartHover(h) {
  const svg = $("#chartBox svg"), hit = $("#chHit"), tip = $("#chTip"), cross = $("#chCross");
  if (!svg || !h.length) return;
  const move = e => {
    const r = svg.getBoundingClientRect(), scale = r.width / CH.W;
    const px = (e.clientX - r.left) / scale;
    let i = 0; CH.xs.forEach((v, j) => { if (Math.abs(v - px) < Math.abs(CH.xs[i] - px)) i = j; });
    const p = h[i];
    cross.setAttribute("x1", CH.xs[i]); cross.setAttribute("x2", CH.xs[i]); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `${esc(fmtDate(p.date))}<br><b>${p.rank ? t("rankLabel", {n: p.rank}) : t("notInTop", {n: p.depth || "?"})}</b>`;
    tip.style.left = CH.xs[i] * scale + "px"; tip.style.top = CH.ys[i] * scale + "px";
    tip.classList.remove("hidden");
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.classList.add("hidden"); cross.setAttribute("visibility", "hidden"); });
}

// ---------------------------------------------------------------- refresh dyal keywords
// Refresh wa7d f nefs l w9t: li tbrek 3lihom f had l w9t kaytzado l queue o kaytdaro mn ba3d.
const refreshing = new Set(), refreshQueue = new Set();
let refreshBusy = false;
function refreshKeywords(ids) {
  ids.forEach(id => { if (!refreshing.has(id)) refreshQueue.add(id); });
  renderKeywords();
  pumpRefresh();
}
async function pumpRefresh() {
  if (refreshBusy || !refreshQueue.size) return;
  refreshBusy = true;
  const ids = [...refreshQueue];
  refreshQueue.clear(); ids.forEach(i => refreshing.add(i));
  renderKeywords();
  try {
    if (LOCAL) {
      let r = await api("/api/refresh", {ids});
      while (r.busy) { await sleep(3000); r = await api("/api/refresh", {ids}); }
      await pollLocal();
    } else {
      const spec = ids.length === KW.length ? "all" : KW.filter(k => ids.includes(k.id)).map(k => `${k.term}|${k.country}`).join(";");
      flash(t("ghKwWorking", {n: ids.length, link: ghLink()}));
      await ghWaitRun({dispatch: {discover: "false", keywords: spec}, event: "workflow_dispatch"});
    }
    await loadAll();
    flash(t("refreshDone", {n: ids.length}), "ok");
  } catch (e) {
    flash(e.message, "bad");
  } finally {
    ids.forEach(i => refreshing.delete(i));
    refreshBusy = false;
    renderKeywords();
    pumpRefresh();
  }
}
async function pollLocal() {
  while (true) {
    const s = await api("/api/state");
    renderStatus(s.status);
    if (!s.status.running) return;
    await sleep(1500);
  }
}

// ---------------------------------------------------------------- events
const act = fn => async e => { try { await fn(e); } catch (err) { flash(err.message, "bad"); } };
document.querySelectorAll(".langEn").forEach(b => b.onclick = () => setLang("en"));
document.querySelectorAll(".langAr").forEach(b => b.onclick = () => setLang("ar"));
$("#tabs").onclick = e => {
  const tb = e.target.dataset.tab; if (!tb) return;
  tab = tb;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tb));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + tb));
  if (tb === "analysis") renderAnalysis();
};
$("#runFull").onclick = act(async () => {
  if (LOCAL) { await api("/api/run", {discover: true}); await pollLocal(); await loadAll(); return; }
  $("#runFull").disabled = true;
  try {
    flash(t("ghWorking", {link: ghLink()}));
    await ghWaitRun({dispatch: {discover: "true", keywords: ""}, event: "workflow_dispatch"});
    await loadAll(); flash(t("runDone"), "ok");
  } finally { $("#runFull").disabled = false; }
});
$("#refreshAll").onclick = () => refreshKeywords(KW.map(k => k.id));
$("#infoCountry").onchange = renderInfo;
["#kwCountry", "#kwSource", "#kwRanked"].forEach(s => $(s).onchange = renderKeywords);
$("#kwSearch").oninput = renderKeywords;
["#cdCountry", "#cdRanked"].forEach(s => $(s).onchange = renderCandidates);
$("#anCountry").onchange = renderAnalysis;
$("#kwTable").onclick = act(async e => {
  const btn = e.target.closest("button");
  if (btn?.dataset.refresh) { e.stopPropagation(); return refreshKeywords([+btn.dataset.refresh]); }
  if (btn?.dataset.chart) { e.stopPropagation(); chartShowTable = false; return showChart(+btn.dataset.chart); }
  if (btn?.dataset.del) {
    e.stopPropagation();
    if (!confirm(t("confirmDelete"))) return;
    const id = +btn.dataset.del;
    const r = await api("/api/keywords/delete", {ids: [id]});
    if (r.github) { KW = KW.filter(k => k.id !== id); renderKeywords(); renderStats(); flash(t("savedGh"), "ok"); }
    else loadAll();
    return;
  }
  const s = e.target.closest("th")?.dataset.sort;
  if (s) { kwSort = {key: s, dir: kwSort.key === s ? -kwSort.dir : 1}; renderKeywords(); return; }
  const tr = e.target.closest("tr[data-id]"); if (tr) showSerp(tr.dataset.id);
});
$("#addBtn").onclick = act(async () => {
  const countries = [...document.querySelectorAll("#addCountries input:checked")].map(i => i.value);
  if (!$("#newTerms").value.trim() || !countries.length) return;
  const r = await api("/api/keywords", {terms: $("#newTerms").value, countries});
  $("#newTerms").value = "";
  if (!r.github) {
    $("#addMsg").textContent = t("addedLocal", {n: r.added});
    await loadAll();
    // local: refresh dyal keywords jdad (li mazal ma tchekawch)
    return refreshKeywords(KW.filter(k => !k.checked).map(k => k.id));
  }
  // GitHub: commit dyal config kaybda check wa7do (push); ntsennawh o n7ddtho data
  $("#addMsg").textContent = t("addedGh", {n: r.added});
  flash(t("ghWorking", {link: ghLink()}));
  await ghWaitRun({event: "push"});
  await loadAll(); flash(t("runDone"), "ok");
});
$("#saveCfg").onclick = act(async () => {
  const r = await api("/api/config", {app_id: $("#cfgApp").value.trim(), daily_hour: $("#cfgHour").value, candidates_per_run: $("#cfgCand").value, countries: $("#cfgCountries").value, my_keywords: $("#cfgKw").value});
  $("#cfgMsg").textContent = t("saved");
  $("#cfgApp").dataset.filled = "";
  if (!r.github) return loadAll();
  flash(t("savedGh") + " " + ghLink(), "ok");
  await ghWaitRun({event: "push"});
  await loadAll(); flash(t("runDone"), "ok");
});
$("#ghSave").onclick = () => {
  store.set("aso_repo", $("#ghRepo").value.trim()); store.set("aso_token", $("#ghToken").value.trim());
  $("#ghMsg").textContent = GH.token() ? t("tokenSaved") : t("tokenRemoved");
  applyI18n(); ghRunStatus();
};
$("#chartClose").onclick = closeChart;
$("#chartModal").onclick = e => { if (e.target.id === "chartModal") closeChart(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && openChartId != null) closeChart(); });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (openChartId != null) showChart(openChartId); }, 150); });
$("#chartTableBtn").onclick = () => { chartShowTable = !chartShowTable; showChart(openChartId); };

async function ghRunStatus() {
  if (LOCAL || !GH.token()) return;
  try {
    const r = await ghApi("/actions/runs?per_page=1");
    const run = r.workflow_runs?.[0];
    if (run && run.status !== "completed") flash(t("runRunning", {s: esc(run.status), link: ghLink(run.html_url)}));
    else if (run && run.conclusion === "failure") flash(t("runFailed", {link: ghLink(run.html_url, "seeError")}), "bad");
  } catch (e) { flash(e.message, "bad"); }
}

async function start() {
  if (!LOCAL) {
    document.documentElement.classList.add("authed");
    $("#gate").classList.add("hidden");
    $("#logout").classList.remove("hidden");
    $("#ghCard").classList.remove("hidden");
    $("#cfgHourWrap").classList.add("hidden");
    $("#ghRepo").value = GH.repo(); $("#ghToken").value = GH.token();
  }
  await loadAll().catch(e => flash(e.message, "bad"));
  if (LOCAL && S?.status.running) pollLocal().then(loadAll);
  ghRunStatus();
}
$("#gateForm").onsubmit = async e => {
  e.preventDefault();
  const token = $("#gateToken").value.trim(), repo = $("#gateRepo").value.trim() || GH.repo();
  $("#gateBtn").disabled = true; $("#gateBtn").textContent = t("gateChecking");
  try {
    const err = await verifyLogin(token, repo);
    if (err) return showGate(err);
    store.set("aso_token", token); store.set("aso_repo", repo);
    $("#gateToken").value = "";
    applyI18n(); start();
  } catch (err) { showGate(esc(err.message)); }
  finally { $("#gateBtn").disabled = false; $("#gateBtn").textContent = t("gateBtn"); }
};
$("#logout").onclick = () => {
  store.set("aso_token", "");
  staticCache = {}; S = null; KW = []; CD = [];
  $("#logout").classList.add("hidden");
  showGate();
};

applyI18n();
if (LOCAL) start();
else if (!GH.token()) showGate();
else verifyLogin(GH.token(), GH.repo()).then(err => err ? (store.set("aso_token", ""), showGate(err)) : start()).catch(e => showGate(esc(e.message)));
</script>
